@if (view) {
  <div
    class="gallery-viewport"
    [style.--gallery-gap]="gap + 'px'"
    [style.--gallery-columns]="columns"
    [style.--gallery-row-height]="rowHeight + 'px'"
    [style.height.px]="view.totalRows * rowHeight"
  >
    <div class="gallery-window" [style.transform]="'translateY(' + view.offsetY + 'px)'">
      @for (row of rows; track row.start) {
        <div class="gallery-row">
          @for (m of row.items; track m ? m.hash : $index) {
            <div class="image-container">
              @if (m) {
                <a routerLink="/viewer" class="tile" data-toggle="tooltip" data-placement="bottom" [title]="m.path" (click)="openMedia(m)">
                  <img class="tile-backdrop" [src]="getThumbnailSrc(m)" alt="" aria-hidden="true" />
                  @if (m.type === 'video' && m.preview) {
                    <app-preview class="tile-media" [slideshow]="true" [height]="tileHeight" [media]="m"></app-preview>
                  } @else {
                    <img class="tile-media" loading="lazy" decoding="async" [src]="getThumbnailSrc(m)" alt="" />
                  }
                  <div class="tile-caption">
                    <strong>{{ getTitle(m) }}</strong>
                    <div class="subtitle">{{ getSubtitle(m) }}</div>
                  </div>
                </a>
              } @else {
                <div class="tile placeholder" aria-hidden="true"></div>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
  <div class="gallery-status text-muted" role="status">{{ status }}</div>
} @else {
  <app-loading></app-loading>
}
