@if (searchPlaylist) {
  <app-playlist [playlist]="currentPlaylist"></app-playlist>
} @else {
  @if (playlists) {
    <div class="container-lg">
      <div class="card">
        <div class="row">
          <div class="col-md-8">
            <input
              [(ngModel)]="addPlaylistModel"
              class="form-control mb-1"
              type="text"
              placeholder="Enter new playlist name..."
              (keyup.enter)="addPlaylistModel && addPlaylist()"
            />
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary col-12" [disabled]="!addPlaylistModel" (click)="addPlaylist()">Add</button>
          </div>
        </div>
      </div>
      @for (playlist of playlists; track playlist) {
        <div class="card">
          <div class="row">
            <div (click)="setPlaylist(playlist)" [class.clickable]="playlist.size" class="col-md-3 preview-column img-fluid img-thumbnail">
              @if (playlist.media) {
                <app-preview class="thubmnail" [slideshow]="true" [height]="120" [media]="playlist.media"></app-preview>
              } @else {
                <fa-icon class="thumbnail" [icon]="faPhotoFilm"></fa-icon>
              }
            </div>
            <div class="col">
              <div class="row actions-row">
                <div class="col align">{{ playlist.name }}</div>
                <div class="col-sm-2 align">{{ playlist.size || 'No' }} items</div>
                <div class="col-sm-1 align">
                  <app-actions [actions]="getActions(playlist)" (actionSelected)="onAction($event)"></app-actions>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <app-loading></app-loading>
  }
}
