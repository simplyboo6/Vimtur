<div class="dropdown" (focusout)="open = false">
  <button class="btn btn-link" type="submit" [class.text-primary]="open" [class.text-muted]="!open" (mousedown)="open = !open" title="Actions Menu">
    <fa-icon [icon]="faBars"></fa-icon>
  </button>
  <div class="dropdown-menu" [class.visible]="open">
    @for (action of actions; track action) {
      <button (mousedown)="actionSelected.emit(action); open = false" class="dropdown-item">
        {{ action.itemName }}
      </button>
    }
  </div>
</div>
