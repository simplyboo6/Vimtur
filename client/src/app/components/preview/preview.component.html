@if (thumbnail && previewSrc && (previewRequested || preloadPreview)) {
  <img class="hidden" [src]="previewSrc" (load)="onPreviewLoaded($event)" />
}
@if (thumbnailSrc) {
  <img class="hidden" [src]="thumbnailSrc" (load)="onThumbnailLoaded($event)" />
}
<canvas
  [width]="canvasWidth"
  [height]="canvasHeight"
  [style.width]="canvasStyleWidth"
  (mouseenter)="beginSlideshow(true)"
  (mouseleave)="endSlideshow(true)"
  #canvasElement
>
</canvas>
