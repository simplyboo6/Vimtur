name: Docker Image CI

on:
  push:
    branches:
      - "master"
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - "master"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The version string baked into the image and reported by GET /api/version.
      # Release tags carry the short commit so a rebuilt tag is distinguishable
      # in-app; branch builds (master and pull requests) get "dev-<short commit>".
      - name: Resolve version name
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          if [ "$REF_TYPE" = "tag" ]; then
            echo "value=${REF_NAME}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker meta
        id: meta
        # Publish metadata is only needed when actually pushing; pull requests
        # build the image without touching anything Docker Hub related.
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            simplyboo6/vimtur
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Pull requests build the image purely to validate the Dockerfile;
          # publishing happens only for pushes to master and version tags.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_NAME=${{ steps.version.outputs.value }}
