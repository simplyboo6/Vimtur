name: Tests CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  api-tests:
    name: API stability tests
    # Pinned rather than ubuntu-latest: latest moved to Ubuntu 26 (Oct 2026),
    # whose apt ffmpeg/graphicsmagick are newer than the server supports and
    # broke every fixture import. 24.04 matches the binary versions the suite
    # is verified against; bump deliberately alongside the Docker image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Skip onnxruntime-node's postinstall CUDA provider download: the suite
    # runs on CPU and the nuget fetch is ~271MB of dead weight without a GPU.
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (Yarn 4)
        run: corepack enable
      # imagemagick (the server spawns its convert/identify — see
      # GM.subClass({ imageMagick: true })) and ffmpeg generate the fixture
      # media the suite imports. This matches the production Docker image's
      # binary set; graphicsmagick alone is not sufficient.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Install dependencies
        run: cd server && yarn link --relative ../common && yarn --immutable
      # run-api-tests.sh builds the server (including generated schemas) and
      # runs the HTTP-only API stability suite against SQLite.
      - name: Run API tests
        run: ./run-api-tests.sh

  database-tests:
    name: Database tests
    # See api-tests above for why this is pinned to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (Yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: cd server && yarn link --relative ../common && yarn --immutable
      - name: Build server
        run: cd server && yarn build
      # run-tests.sh starts a disposable MongoDB container and runs the mocha
      # suite against it.
      - name: Run database tests
        run: ./run-tests.sh
